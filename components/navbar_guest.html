<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILOTI Navbar - Guest</title>
    <style>
        /* Custom scrollbar for sidebar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 2px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        /* Smooth transitions */
        .sidebar-overlay {
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }
        .sidebar {
            transition: transform 0.3s ease-in-out;
        }
        .hidden-guest { 
            display: none !important;
        }
    </style>
</head>
<body>
    <nav class="hidden lg:flex bg-white/80 backdrop-blur-lg border-b border-gray-100 shadow-sm px-6 py-4 items-center justify-between sticky top-0 z-40 transition-all duration-300">
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-green-400 rounded-xl flex items-center justify-center shadow-md shadow-blue-500/20 overflow-hidden">
                    <img src="../assets/img/logo_filoti.png" alt="Logo" class="w-full h-full object-cover" onerror="this.style.display='none'"/>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800 tracking-tight">FILOTI</h1>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Student Lost and Found</p>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-1">

            <a href="lost_item" class="nav-link px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:text-blue-600 hover:bg-blue-50 transition-all" data-page="lost-items">Lost Items</a>
            <a href="find_item" class="nav-link px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:text-blue-600 hover:bg-blue-50 transition-all" data-page="found-items">Found Items</a>
            
            <a href="notification" class="nav-link px-4 py-2 text-sm font-medium rounded-lg text-slate-600 hover:text-blue-600 hover:bg-blue-50 transition-all" data-page="notification">Notification</a>
            
            <div class="pl-2 border-l border-slate-200 ml-2">
                <button id="desktop-auth-button" class="ml-2 bg-blue-600 text-white text-sm font-semibold px-5 py-2 rounded-xl hover:bg-blue-700 hover:shadow-md hover:shadow-blue-500/20 transition-all active:scale-95">
                    Login
                </button>
            </div>
        </div>
    </nav>

    <header class="lg:hidden bg-white/80 backdrop-blur-lg border-b border-gray-100 shadow-sm px-4 py-3 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-green-400 rounded-xl flex items-center justify-center shadow-sm overflow-hidden">
                <img src="../assets/img/logo_filoti.png" alt="Logo" class="w-full h-full object-cover" onerror="this.style.display='none'"/>
            </div>
            <div>
                <h1 class="text-lg font-bold text-slate-800 tracking-tight">FILOTI</h1>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button id="menu-toggle" class="p-2 bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-800 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </header>

    <div id="sidebar-overlay" class="lg:hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 opacity-0 invisible sidebar-overlay">
        <div id="sidebar" class="sidebar fixed right-0 top-0 h-full w-[280px] bg-white shadow-2xl transform translate-x-full custom-scrollbar overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-lg font-bold text-slate-800">Menu</h2>
                    <button id="close-sidebar" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <nav class="space-y-2">
                    <a href="lost_item" class="mobile-nav-link flex items-center py-3 px-4 text-sm font-medium text-slate-600 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition-colors" data-page="lost-items">
                        Lost Items
                    </a>
                    <a href="find_item" class="mobile-nav-link flex items-center py-3 px-4 text-sm font-medium text-slate-600 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition-colors" data-page="found-items">
                        Found Items
                    </a>
                    <a href="notification" class="mobile-nav-link flex items-center py-3 px-4 text-sm font-medium text-slate-600 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition-colors" data-page="notification">
                        Notification
                    </a>
                    <div class="pt-6 mt-4 border-t border-slate-100">
                        <button id="mobile-auth-button" class="w-full bg-blue-600 text-white font-semibold py-3 px-4 rounded-xl hover:bg-blue-700 hover:shadow-md hover:shadow-blue-500/20 transition-all active:scale-95">
                            Login
                        </button>
                    </div>
                </nav>
            </div>
        </div>
    </div>

    <script>
        class FilotiNavbar {
            constructor() {
                this.currentUser = null;
                this.init();
            }

            async init() {
                await this.fetchCurrentUserDetails(); 
                this.setupMobileSidebar(); 
                this.handleResize();
                this.setActiveNavigation();
                this.updateAuthUI();
                
                window.addEventListener("resize", () => this.handleResize());
            }

            async fetchCurrentUserDetails() {
                try {
                    const response = await fetch('https://filoti-backend.vercel.app/api/me', {
                        method: 'GET',
                        credentials: 'include'
                    });

                    if (response.ok) {
                        this.currentUser = await response.json();
                    } else {
                        this.currentUser = { id: null, username: "Guest", is_admin: false };
                    }
                } catch (error) {
                    console.error('Network error fetching current user details:', error);
                    this.currentUser = { id: null, username: "Network Error", is_admin: false };
                }
            }

            updateAuthUI() {
                const desktopAuthButton = document.getElementById('desktop-auth-button');
                const mobileAuthButton = document.getElementById('mobile-auth-button');

                if (this.currentUser && this.currentUser.id) { 
                    if (desktopAuthButton) {
                        desktopAuthButton.textContent = 'Logout';
                        desktopAuthButton.onclick = () => this.logout();
                        desktopAuthButton.className = 'ml-2 bg-rose-50 text-rose-600 text-sm font-semibold px-5 py-2 rounded-xl hover:bg-rose-100 hover:text-rose-700 transition-all active:scale-95';
                    }
                    if (mobileAuthButton) {
                        mobileAuthButton.textContent = 'Logout';
                        mobileAuthButton.onclick = () => this.logout();
                        mobileAuthButton.className = 'w-full bg-rose-50 text-rose-600 font-semibold py-3 px-4 rounded-xl hover:bg-rose-100 transition-all active:scale-95';
                    }
                } else { 
                    if (desktopAuthButton) {
                        desktopAuthButton.textContent = 'Login';
                        desktopAuthButton.onclick = () => window.location.href = 'login';
                        desktopAuthButton.className = 'ml-2 bg-blue-600 text-white text-sm font-semibold px-5 py-2 rounded-xl hover:bg-blue-700 hover:shadow-md hover:shadow-blue-500/20 transition-all active:scale-95';
                    }
                    if (mobileAuthButton) {
                        mobileAuthButton.textContent = 'Login';
                        mobileAuthButton.onclick = () => {
                            window.location.href = 'login';
                            this.closeSidebar();
                        };
                        mobileAuthButton.className = 'w-full bg-blue-600 text-white font-semibold py-3 px-4 rounded-xl hover:bg-blue-700 hover:shadow-md hover:shadow-blue-500/20 transition-all active:scale-95';
                    }
                }
            }

            async logout() {
                try {
                    const response = await fetch('https://filoti-backend.vercel.app/api/logout', {
                        method: 'POST',
                        credentials: 'include'
                    });

                    if (response.ok) {
                        console.log('Successfully logged out.');
                        window.location.href = 'login'; 
                    } else {
                        const errorData = await response.json();
                        console.error('Logout failed:', errorData.error);
                        alert('Gagal logout: ' + (errorData.error || 'Terjadi kesalahan.'));
                    }
                } catch (error) {
                    console.error('Network error during logout:', error);
                    alert('Gagal logout: Terjadi kesalahan jaringan.');
                }
            }

            setupMobileSidebar() {
                const menuToggle = document.getElementById("menu-toggle");
                const closeSidebar = document.getElementById("close-sidebar");
                const sidebarOverlay = document.getElementById("sidebar-overlay");
                const sidebar = document.getElementById("sidebar");

                if (!menuToggle) { console.error("Menu toggle button not found!"); return; }
                if (!closeSidebar) { console.error("Close sidebar button not found!"); return; }
                if (!sidebarOverlay) { console.error("Sidebar overlay not found!"); return; }
                if (!sidebar) { console.error("Sidebar not found!"); return; }

                menuToggle.addEventListener("click", () => this.openSidebar());
                closeSidebar.addEventListener("click", () => this.closeSidebar());

                sidebarOverlay.addEventListener("click", (e) => {
                    if (e.target === sidebarOverlay) {
                        this.closeSidebar();
                    }
                });

                document.addEventListener("keydown", (e) => {
                    if (e.key === "Escape") {
                        this.closeSidebar();
                    }
                });
            }

            openSidebar() {
                const sidebarOverlay = document.getElementById("sidebar-overlay");
                const sidebar = document.getElementById("sidebar");
                
                if (sidebarOverlay) { 
                    sidebarOverlay.classList.remove("opacity-0", "invisible");
                    sidebarOverlay.classList.add("opacity-100", "visible");
                }
                if (sidebar) { 
                    sidebar.classList.remove("translate-x-full");
                    sidebar.classList.add("translate-x-0");
                }
                document.body.style.overflow = "hidden";
            }

            closeSidebar() {
                const sidebarOverlay = document.getElementById("sidebar-overlay");
                const sidebar = document.getElementById("sidebar");
                
                if (sidebarOverlay) { 
                    sidebarOverlay.classList.add("opacity-0", "invisible");
                    sidebarOverlay.classList.remove("opacity-100", "visible");
                }
                if (sidebar) { 
                    sidebar.classList.add("translate-x-full");
                    sidebar.classList.remove("translate-x-0");
                }
                document.body.style.overflow = "auto";
            }

            handleResize() {
                if (window.innerWidth >= 1024) {
                    this.closeSidebar();
                }
            }

            setActiveNavigation() {
                const currentPage = window.location.pathname.split('/').pop().replace('.html', '');
                
                const pageMap = {
                    'lost_item': 'lost-items',
                    '': 'lost-items',
                    'find_item': 'found-items',
                    'details_item': 'found-items',
                    'history': 'history', 
                    'history_details': 'history',
                    'history_details_bukti': 'history',
                    'report_item': 'report-item', 
                    'notification': 'notification',
                    'edit_item':'report-item'
                };

                const activePage = pageMap[currentPage] || 'lost-items';

                document.querySelectorAll('nav .nav-link').forEach(link => { 
                    const linkPage = link.getAttribute('data-page');
                    if (linkPage === activePage) {
                        link.classList.remove('text-slate-600');
                        link.classList.add('text-blue-600', 'bg-blue-50');
                    } else {
                        link.classList.remove('text-blue-600', 'bg-blue-50');
                        link.classList.add('text-slate-600');
                    }
                });

                document.querySelectorAll('#sidebar .mobile-nav-link').forEach(link => { 
                    const linkPage = link.getAttribute('data-page');
                    if (linkPage === activePage) {
                        link.classList.remove('text-slate-600');
                        link.classList.add('text-blue-600', 'bg-blue-50');
                    } else {
                        link.classList.remove('text-blue-600', 'bg-blue-50');
                        link.classList.add('text-slate-600');
                    }
                });
            }
        }
        window.FilotiNavbar = new FilotiNavbar(); 
    </script>
</body>
</html>
