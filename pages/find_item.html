<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FILOTI - Student Lost and Found Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
      /* Gaya untuk dropdown */
      .dropdown-menu {
        max-height: 250px;
        overflow-y: auto;
      }
      .dropdown-menu::-webkit-scrollbar {
        width: 4px;
      }
      .dropdown-menu::-webkit-scrollbar-track {
        background: #f8fafc;
      }
      .dropdown-menu::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 2px;
      }
      .dropdown-menu::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      /* Gaya loading spinner */
      .spinner {
          border: 3px solid rgba(59, 130, 246, 0.1);
          border-left-color: #3b82f6;
          border-radius: 50%;
          width: 32px;
          height: 32px;
          animation: spin 1s linear infinite;
      }
      @keyframes spin {
          to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 font-sans text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="navbar-container"></div>

    <main class="container mx-auto px-4 sm:px-6 py-8 max-w-6xl min-h-[calc(100vh-80px)] flex flex-col">
      <!-- Breadcrumb & Header Area -->
      <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Found Items</h2>
          <p class="text-sm text-slate-500 mt-1">Browse items that have been found and reported.</p>
        </div>

        <div class="relative inline-block text-left self-start sm:self-auto">
          <div>
            <button
              type="button"
              id="filter-location-btn"
              class="inline-flex justify-between items-center w-full sm:w-auto rounded-xl border border-slate-200 shadow-sm px-4 py-2.5 bg-white text-sm font-semibold text-slate-700 hover:bg-slate-50 hover:border-slate-300 focus:outline-none focus:ring-4 focus:ring-slate-100 transition-all active:scale-[0.98]"
              aria-haspopup="true"
              aria-expanded="true"
            >
              <span id="filter-label" class="mr-2">Filter by Location</span>
              <svg class="h-4 w-4 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>

          <div
            id="location-dropdown"
            class="origin-top-right absolute right-0 mt-2 w-56 rounded-xl shadow-xl shadow-slate-200/50 bg-white border border-slate-100 hidden z-20 dropdown-menu"
            role="menu"
            aria-orientation="vertical"
            aria-labelledby="filter-location-btn"
          >
            <div class="p-1" role="none">
              <!-- Location items injected via JS -->
            </div>
          </div>
        </div>
      </div>

      <!-- Loading State -->
      <div id="loading-message-found" class="flex flex-col items-center justify-center flex-grow py-20 hidden">
          <div class="spinner mb-4"></div>
          <p class="text-slate-500 font-medium animate-pulse">Loading found items...</p>
      </div>

      <!-- Content Grid -->
      <div id="found-items-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Cards injected via JS -->
      </div>
    </main>

    <script src="../assets/js/navbar_loader.js"></script>
    <script src="../assets/js/pages/find_item.js"></script>
  </body>
</html>
