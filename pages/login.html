<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Filoti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen font-sans text-slate-800 selection:bg-blue-100 selection:text-blue-900">
    <div class="w-full max-w-md px-6">
        <!-- Logo Area -->
        <div class="flex justify-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-green-400 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20 overflow-hidden">
                <img src="../assets/img/logo_filoti.png" alt="Logo" class="w-full h-full object-cover" onerror="this.style.display='none'">
                <span class="text-white font-bold text-xl" style="display: none;" id="fallback-logo">F</span>
                <script>
                    document.querySelector('img').addEventListener('error', function() {
                        document.getElementById('fallback-logo').style.display = 'block';
                    });
                </script>
            </div>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome to Filoti</h2>
                <p class="text-sm text-slate-500 mt-2">Sign in to manage student lost and found items</p>
            </div>
            
            <div class="bg-blue-50/50 border border-blue-100 text-blue-800 px-4 py-3.5 rounded-xl text-sm mb-6 flex items-start gap-3" role="alert">
                <svg class="w-5 h-5 text-blue-500 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <div>
                    <strong class="font-semibold block mb-1">Admin Demo Account:</strong>
                    <ul class="list-disc list-inside space-y-0.5 text-blue-700/80">
                        <li>User: <span class="font-mono bg-blue-100 px-1 py-0.5 rounded text-xs text-blue-800">admin</span></li>
                        <li>Pass: <span class="font-mono bg-blue-100 px-1 py-0.5 rounded text-xs text-blue-800">12345</span></li>
                    </ul>
                </div>
            </div>

            <div id="login-form-container">
                <form id="admin-login-form" class="space-y-5">
                    <div>
                        <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                        <input type="text" id="username" name="username" class="bg-slate-50 border border-slate-200 text-slate-900 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 block w-full px-4 py-2.5 outline-none transition-all placeholder:text-slate-400" placeholder="Enter admin username" required>
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                        <input type="password" id="password" name="password" class="bg-slate-50 border border-slate-200 text-slate-900 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 block w-full px-4 py-2.5 outline-none transition-all placeholder:text-slate-400" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl transition-all shadow-sm hover:shadow-md hover:shadow-blue-600/20 focus:ring-4 focus:ring-blue-600/20 active:scale-[0.98]">
                        Login as Admin
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </form>
                
                <div class="relative flex items-center py-6">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink-0 mx-4 text-slate-400 text-sm font-medium">OR</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <button id="guest-login-btn" class="w-full flex items-center justify-center gap-2 bg-white border border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-2.5 px-4 rounded-xl transition-all focus:ring-4 focus:ring-slate-100 active:scale-[0.98] shadow-sm">
                    Continue as Guest
                </button>

                <div id="message" class="hidden mt-6 text-center text-sm font-medium px-4 py-3 rounded-xl border"></div>
            </div>
        </div>
        
        <p class="text-center text-slate-400 text-sm mt-8">
            &copy; 2024 Filoti. Student Lost & Found.
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const adminLoginForm = document.getElementById('admin-login-form');
            const guestLoginBtn = document.getElementById('guest-login-btn');
            const messageDiv = document.getElementById('message');

            function showMessage(msg, type = 'info') {
                messageDiv.textContent = msg;
                messageDiv.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'border-red-200', 'bg-green-50', 'text-green-600', 'border-green-200', 'bg-blue-50', 'text-blue-600', 'border-blue-200');
                
                if (type === 'error') {
                    messageDiv.classList.add('bg-red-50', 'text-red-600', 'border-red-200');
                } else if (type === 'success') {
                    messageDiv.classList.add('bg-green-50', 'text-green-600', 'border-green-200');
                } else {
                    messageDiv.classList.add('bg-blue-50', 'text-blue-600', 'border-blue-200');
                }
            }

            adminLoginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const btn = this.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                
                btn.innerHTML = '<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>';
                btn.disabled = true;

                try {
                    const response = await fetch('https://filoti-backend.vercel.app/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password }),
                        credentials: 'include'
                    });

                    const data = await response.json();
                    if (response.ok) {
                        showMessage('Login admin berhasil! Mengarahkan...', 'success');
                        setTimeout(() => window.location.href = 'lost_item', 500); 
                    } else {
                        showMessage(data.error || 'Login admin gagal.', 'error');
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                } catch (error) {
                    console.error('Error during admin login:', error);
                    showMessage('Terjadi kesalahan jaringan saat login admin.', 'error');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });

            guestLoginBtn.addEventListener('click', async function() {
                const btn = this;
                const originalText = btn.innerHTML;
                
                btn.innerHTML = '<div class="w-5 h-5 border-2 border-slate-400/30 border-t-slate-600 rounded-full animate-spin"></div>';
                btn.disabled = true;

                try {
                    const response = await fetch('https://filoti-backend.vercel.app/api/guest-login', {
                        method: 'POST',
                        credentials: 'include'
                    });

                    const data = await response.json();
                    if (response.ok) {
                        showMessage('Login guest berhasil! Mengarahkan...', 'success');
                        setTimeout(() => window.location.href = 'lost_item', 500);
                    } else {
                        showMessage(data.error || 'Login guest gagal.', 'error');
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                } catch (error) {
                    console.error('Error during guest login:', error);
                    showMessage('Terjadi kesalahan jaringan saat login guest.', 'error');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
